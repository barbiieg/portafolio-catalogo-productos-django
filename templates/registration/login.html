{% extends 'base.html' %}

{% block contenido %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header text-center" style="background: linear-gradient(90deg, #F8C8DC, #D4EDDA);">
        <h3 style="color: #4A4A4A;">🔑 Iniciar Sesión</h3>
      </div>
      <div class="card-body p-4">
        {% if form.errors %}
          <div class="alert alert-danger">
            Usuario o contraseña incorrectos. Intenta nuevamente.
          </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          
          <div class="mb-3">
            <label for="id_username" class="form-label">Usuario</label>
            <input type="text" name="username" id="id_username" class="form-control" required>
          </div>

          <div class="mb-4">
            <label for="id_password" class="form-label">Contraseña</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-success">Ingresar</button>
          </div>

          <!-- Redirige a la página principal después de entrar -->
          <input type="hidden" name="next" value="/">
        </form>

        <div class="text-center mt-3">
          <a href="/" class="text-decoration-none">Volver al catálogo</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
