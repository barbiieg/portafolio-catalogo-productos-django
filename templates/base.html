<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <!-- Bootstrap para dar estilo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h1 class="text-center text-primary mb-4">Administración de Catálogo</h1>

        <!-- Menú de navegación -->
        <nav class="mb-4">
            <a href="{% url 'listar_productos' %}" class="btn btn-outline-primary me-2">Ver todos</a>
            <a href="{% url 'crear_producto' %}" class="btn btn-success">Agregar nuevo</a>
        </nav>

        <!-- Mensajes de éxito o error -->
        {% if messages %}
            {% for mensaje in messages %}
                {% if mensaje.tags == 'success' %}
                    <div class="alert alert-success mb-3" role="alert">
                        {{ mensaje }}
                    </div>
                {% else %}
                    <div class="alert alert-danger mb-3" role="alert">
                        {{ mensaje }}
                    </div>
                {% endif %}
            {% endfor %}
        {% endif %}

        <!-- Contenido de cada página -->
        {% block contenido %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
