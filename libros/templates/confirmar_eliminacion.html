{% extends 'base.html' %}

{% block contenido %}
<h2>¿Eliminar este libro?</h2>
<p>¿Seguro que quieres borrar: <strong>{{ libro.titulo }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'listar_libros' %}">Cancelar</a>
</form>
{% endblock %}
